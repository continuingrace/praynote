<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f4"><meta name="color-scheme" content="light dark"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Pray Note"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><title>Pray Note</title><link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><style>:root{--bg:#f7f7f4;--card:#fff;--text:#20201d;--muted:#8e8e86;--line:#e5e5df;--line-strong:#d7d7d0;--accent:#6f7564;--control:rgba(255,255,255,.58);--placeholder:#aaa;--danger:#9a5e58;--focus:#596150;color-scheme:light}[data-theme="contrast"]{--bg:#fff;--card:#fff;--text:#000;--muted:#3d3d3d;--line:#707070;--line-strong:#3c3c3c;--accent:#244d2b;--control:#fff;--placeholder:#555;--danger:#7b1717;--focus:#000;color-scheme:light}[data-theme="dark"]{--bg:#151613;--card:#1e1f1b;--text:#f3f3ee;--muted:#b6b7ae;--line:#3b3d36;--line-strong:#5a5c53;--accent:#c3c9ad;--control:#20211d;--placeholder:#8f9188;--danger:#e1a29a;--focus:#e7ebd8;color-scheme:dark}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.018em;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}.app{width:min(100%,760px);max-width:100%;margin:auto;padding:20px 20px calc(72px + env(safe-area-inset-bottom));min-width:0}.top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px 10px;margin-bottom:42px}.brand{font-size:14px;font-weight:650;white-space:nowrap;min-width:0}.version{justify-self:end;border:1px solid var(--line);background:var(--control);border-radius:999px;padding:6px 9px;color:var(--muted);font-size:11px;font-weight:600}.controls{grid-column:1/-1;display:flex;align-items:center;flex-wrap:wrap;gap:7px;min-width:0}.control,.data-control{display:flex;align-items:center;gap:6px;min-height:34px;border:1px solid var(--line);background:var(--control);border-radius:999px;padding-left:10px;min-width:0}.control-label{flex:0 0 auto;color:var(--muted);font-size:9px;line-height:1;font-weight:750;letter-spacing:.06em}.control select{min-width:0;max-width:132px;border:0;outline:0;background:transparent;color:var(--text);padding:7px 24px 7px 1px;font:600 11px Pretendard,-apple-system,sans-serif}.data-control{padding:4px 5px 4px 10px}.data-actions{display:flex;gap:3px}.mini-btn{border:0;background:transparent;color:var(--text);border-radius:999px;padding:6px 8px;font:650 10px Pretendard,-apple-system,sans-serif;cursor:pointer}.mini-btn:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}button,select,input,textarea{font-family:inherit}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.nav button{border:0;background:transparent;color:var(--muted);padding:8px;border-radius:9px;font:inherit;cursor:pointer}.arrows{display:flex;gap:4px}.date{color:var(--accent);font-size:13px;font-weight:650;margin:0 0 7px;overflow-wrap:anywhere}h1{font-size:clamp(31px,7vw,46px);line-height:1.1;letter-spacing:-.016em;margin:0;font-weight:680;overflow-wrap:anywhere}.sub{color:var(--muted);font-size:14px;line-height:1.78;width:100%;max-width:650px;margin:16px 0 26px;white-space:normal;word-break:normal;overflow-wrap:anywhere;line-break:auto}.progress{display:flex;align-items:center;gap:12px;margin-bottom:28px;min-width:0}.track{height:3px;background:var(--line);flex:1;min-width:0;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:var(--accent);transition:.2s}.count{font-size:11px;color:var(--muted);min-width:38px;text-align:right}.entries{display:grid;gap:12px;min-width:0}.entry{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:9px;padding:16px 12px 15px 15px;background:var(--card);border:1px solid var(--line);border-radius:18px;min-width:0}.entry>div{min-width:0}.check{width:28px;height:28px;border:1px solid var(--line-strong);border-radius:50%;background:var(--card);color:var(--text);cursor:pointer}.done .check{background:var(--accent);border-color:var(--accent);color:var(--bg)}.check:after{content:'✓';opacity:0}.done .check:after{opacity:1}.meta{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px}.num{color:var(--accent);margin-right:8px}textarea{display:block;width:100%;max-width:100%;min-width:0;min-height:54px;resize:none;overflow:hidden;border:0;outline:0;background:transparent;color:var(--text);font:15px/1.7 Pretendard,-apple-system,sans-serif;padding:0;letter-spacing:-.01em}.done textarea{color:var(--muted)}textarea::placeholder,input::placeholder{color:var(--placeholder);opacity:1}.delete{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}.add{width:100%;margin-top:12px;padding:17px;border:1px dashed var(--line-strong);border-radius:18px;background:transparent;color:var(--muted);font:600 13px Pretendard,-apple-system,sans-serif;cursor:pointer}.reflection{margin-top:40px;padding-top:25px;border-top:1px solid var(--line)}label.reflection-label{display:block;color:var(--muted);font-size:11px;font-weight:650;margin-bottom:9px}input[type="text"]{width:100%;border:0;border-bottom:1px solid var(--line);outline:0;background:transparent;color:var(--text);padding:4px 0 12px;font:15px Pretendard,-apple-system,sans-serif}.saved{min-height:18px;margin-top:12px;text-align:right;color:var(--muted);font-size:11px}.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}@media(max-width:560px){.app{padding:18px 16px calc(56px + env(safe-area-inset-bottom))}.top{margin-bottom:38px}.controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch}.control,.data-control{width:100%;min-width:0}.control select{width:100%;max-width:none}.data-control{grid-column:1/-1}.data-actions{margin-left:auto}.entry{grid-template-columns:34px minmax(0,1fr) auto}.sub{font-size:13.5px;line-height:1.72}}@media(max-width:380px){.app{padding-left:14px;padding-right:14px}.controls{grid-template-columns:1fr}.data-control{grid-column:auto}.brand{font-size:13px}.control-label{font-size:8px}.mini-btn{padding-left:7px;padding-right:7px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}</style></head><body><main class="app"><header class="top"><div class="brand">● &nbsp;Pray Note</div><span class="version">v1.3.0</span><div class="controls" aria-label="Settings"><label class="control"><span class="control-label">LANGUAGE</span><select id="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="de">Deutsch</option><option value="ja">日本語</option><option value="zh">中文</option></select></label><label class="control"><span class="control-label">THEME</span><select id="theme" aria-label="Theme"></select></label><div class="data-control"><span class="control-label">BACKUP</span><div class="data-actions"><button class="mini-btn" id="backup" type="button"></button><button class="mini-btn" id="restore" type="button"></button></div></div><input class="sr-only" id="restoreFile" type="file" accept="application/json,.json"></div></header><section><div class="nav"><div class="arrows"><button id="prev" type="button" aria-label="Previous day">‹</button><button id="next" type="button" aria-label="Next day">›</button></div><button id="today" type="button"></button></div><p class="date" id="date"></p><h1 id="title"></h1><p class="sub" id="sub"></p><div class="progress"><div class="track"><div class="bar" id="bar"></div></div><span class="count" id="count">0 / 5</span></div></section><section class="entries" id="entries"></section><button class="add" id="add" type="button"></button><section class="reflection"><label class="reflection-label" for="verse" id="verseLabel"></label><input id="verse" type="text" autocomplete="off"><div class="saved" id="saved" aria-live="polite"></div></section></main><template id="tpl"><article class="entry"><button class="check" type="button"></button><div><div class="meta"><span class="num"></span><span>PRAYER</span></div><textarea rows="2"></textarea></div><button class="delete" type="button">×</button></article></template><script>const V='1.3.0',KEY='praynote:data:v1',LK='praynote:lang',TK='praynote:theme',BASE=5;const T={ko:{today:'오늘',title:'오늘의 쓰는 기도',sub:'아무 것도 염려하지 말고 다만 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라 그리하면 모든 지각에 뛰어난 하나님의 평강이 그리스도 예수 안에서 너희 마음과 생각을 지키시리라 (빌립보서 4:6-7)',add:'＋ 기도 한 가지 더',verse:'오늘 마음에 남은 말씀 · 문장',versePh:'한 문장만 가볍게 남겨도 좋아요',ph:'기도 제목을 적어보세요',saved:'이 기기에서 자동 저장됨',saving:'저장 중…',locale:'ko-KR',themeCurrent:'현재 색상',themeContrast:'고대비',themeDark:'다크 모드',backup:'백업',restore:'복구',restoreAsk:'현재 저장된 내용을 백업 파일의 내용으로 바꿀까요?',restoreDone:'백업을 복구했습니다.',restoreError:'올바른 Pray Note 백업 파일이 아닙니다.'},en:{today:'Today',title:"Today's Written Prayer",sub:'Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus. (Philippians 4:6–7)',add:'＋ Add another prayer',verse:'A verse · sentence that stayed with me',versePh:'Leave just one sentence if you like',ph:'Write a prayer here',saved:'Saved on this device',saving:'Saving…',locale:'en-US',themeCurrent:'Original',themeContrast:'High contrast',themeDark:'Dark mode',backup:'Backup',restore:'Restore',restoreAsk:'Replace the saved data on this device with this backup?',restoreDone:'Backup restored.',restoreError:'This is not a valid Pray Note backup file.'},de:{today:'Heute',title:'Das heutige Gebet zum Schreiben',sub:'Sorget nichts! sondern in allen Dingen lasset eure Bitten im Gebet und Flehen mit Danksagung vor Gott kund werden. Und der Friede Gottes, welcher höher ist denn alle Vernunft, bewahre eure Herzen und Sinne in Christo Jesu! (Philipper 4,6–7)',add:'＋ Weiteres Gebet',verse:'Wort · Satz, der heute bleibt',versePh:'Ein einziger Satz genügt',ph:'Gebetsanliegen notieren',saved:'Auf diesem Gerät gespeichert',saving:'Speichern…',locale:'de-DE',themeCurrent:'Original',themeContrast:'Hoher Kontrast',themeDark:'Dunkel',backup:'Sichern',restore:'Wiederherstellen',restoreAsk:'Gespeicherte Daten auf diesem Gerät durch diese Sicherung ersetzen?',restoreDone:'Sicherung wiederhergestellt.',restoreError:'Keine gültige Pray-Note-Sicherungsdatei.'},ja:{today:'今日',title:'今日書く祈り',sub:'何事をも思い煩うな。ただ、事ごとに、祈と願いとをなし、感謝して自分の求めるところを神に申し上げるがよい。そうすれば、人知ではとうてい測り知ることのできない神の平安が、あなたがたの心と思いとを、キリスト・イエスにあって守るであろう。（ピリピ人への手紙 4:6–7）',add:'＋ 祈りをもう一つ',verse:'今日、心に残った御言葉 · 一文',versePh:'一文だけでも残してみましょう',ph:'祈りの課題を書いてください',saved:'この端末に自動保存しました',saving:'保存中…',locale:'ja-JP',themeCurrent:'現在の色',themeContrast:'高コントラスト',themeDark:'ダークモード',backup:'バックアップ',restore:'復元',restoreAsk:'この端末の保存内容をバックアップの内容に置き換えますか？',restoreDone:'バックアップを復元しました。',restoreError:'有効な Pray Note バックアップではありません。'},zh:{today:'今天',title:'今天写下的祷告',sub:'应当一无挂虑，只要凡事借着祷告、祈求和感谢，将你们所要的告诉神。神所赐、出人意外的平安，必在基督耶稣里保守你们的心怀意念。（腓立比书 4:6–7）',add:'＋ 再添加一项祷告',verse:'今天留在心里的经文 · 一句话',versePh:'只写下一句话也很好',ph:'写下祷告事项',saved:'已自动保存在此设备',saving:'保存中…',locale:'zh-CN',themeCurrent:'当前配色',themeContrast:'高对比度',themeDark:'深色模式',backup:'备份',restore:'恢复',restoreAsk:'要用此备份替换本设备上保存的内容吗？',restoreDone:'备份已恢复。',restoreError:'这不是有效的 Pray Note 备份文件。'}};let lang=localStorage.getItem(LK)||'ko',theme=localStorage.getItem(TK)||'current',cur=new Date(),timer;cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate());const $=s=>document.querySelector(s),entries=$('#entries');function key(){return [cur.getFullYear(),String(cur.getMonth()+1).padStart(2,'0'),String(cur.getDate()).padStart(2,'0')].join('-')}function all(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return{}}}function day(){let d=all()[key()]||{prayers:[],verse:''};while(d.prayers.length<BASE)d.prayers.push({text:'',done:false});return d}function resize(x){x.style.height='auto';x.style.height=Math.max(54,x.scrollHeight)+'px'}function applyTheme(){document.documentElement.dataset.theme=theme==='current'?'':theme;const meta=document.querySelector('meta[name="theme-color"]');meta.content=theme==='dark'?'#151613':'#f7f7f4';$('#theme').value=theme}function save(){let a=all();a[key()]={prayers:[...entries.children].map(e=>({text:e.querySelector('textarea').value,done:e.classList.contains('done')})),verse:$('#verse').value};localStorage.setItem(KEY,JSON.stringify(a));progress();$('#saved').textContent=T[lang].saved;setTimeout(()=>$('#saved').textContent='',1300)}function queue(){clearTimeout(timer);$('#saved').textContent=T[lang].saving;timer=setTimeout(save,250)}function card(p,i){let e=$('#tpl').content.firstElementChild.cloneNode(true),ta=e.querySelector('textarea');e.querySelector('.num').textContent=String(i+1).padStart(2,'0');ta.value=p.text||'';ta.placeholder=T[lang].ph;e.classList.toggle('done',!!p.done);e.querySelector('.delete').hidden=i<BASE;ta.oninput=()=>{resize(ta);queue()};e.querySelector('.check').onclick=()=>{e.classList.toggle('done');queue()};e.querySelector('.delete').onclick=()=>{if(entries.children.length>BASE){e.remove();renum();queue()}};requestAnimationFrame(()=>resize(ta));return e}function renum(){[...entries.children].forEach((e,i)=>{e.querySelector('.num').textContent=String(i+1).padStart(2,'0');e.querySelector('.delete').hidden=i<BASE});progress()}function progress(){let es=[...entries.children],n=es.filter(e=>e.classList.contains('done')).length;$('#count').textContent=n+' / '+es.length;$('#bar').style.width=(es.length?n/es.length*100:0)+'%'}function themeOptions(){let t=T[lang];$('#theme').innerHTML=`<option value="current">${t.themeCurrent}</option><option value="contrast">${t.themeContrast}</option><option value="dark">${t.themeDark}</option>`;$('#theme').value=theme}function text(){let t=T[lang];document.documentElement.lang=lang;$('#today').textContent=t.today;$('#title').textContent=t.title;$('#sub').textContent=t.sub;$('#add').textContent=t.add;$('#verseLabel').textContent=t.verse;$('#verse').placeholder=t.versePh;$('#backup').textContent=t.backup;$('#restore').textContent=t.restore;themeOptions();$('#date').textContent=new Intl.DateTimeFormat(t.locale,{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(cur);document.title=t.title+' · Pray Note'}function render(){let d=day();text();entries.innerHTML='';d.prayers.forEach((p,i)=>entries.append(card(p,i)));$('#verse').value=d.verse||'';progress();applyTheme()}function move(n){save();cur.setDate(cur.getDate()+n);render();scrollTo({top:0,behavior:'smooth'})}function backup(){save();const payload={app:'Pray Note',version:V,exportedAt:new Date().toISOString(),language:lang,theme,data:all()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`praynote-backup-${key()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function restoreFile(file){try{const payload=JSON.parse(await file.text());if(!payload||payload.app!=='Pray Note'||typeof payload.data!=='object'||Array.isArray(payload.data))throw new Error('invalid');if(!confirm(T[lang].restoreAsk))return;localStorage.setItem(KEY,JSON.stringify(payload.data));if(T[payload.language]){lang=payload.language;localStorage.setItem(LK,lang);$('#lang').value=lang}if(['current','contrast','dark'].includes(payload.theme)){theme=payload.theme;localStorage.setItem(TK,theme)}render();alert(T[lang].restoreDone)}catch(err){alert(T[lang].restoreError)}finally{$('#restoreFile').value=''}}$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#today').onclick=()=>{save();let d=new Date();cur=new Date(d.getFullYear(),d.getMonth(),d.getDate());render()};$('#add').onclick=()=>{let e=card({text:'',done:false},entries.children.length);entries.append(e);renum();queue();e.querySelector('textarea').focus()};$('#verse').oninput=queue;$('#lang').value=lang;$('#lang').onchange=e=>{lang=e.target.value;localStorage.setItem(LK,lang);render()};$('#theme').onchange=e=>{theme=e.target.value;localStorage.setItem(TK,theme);applyTheme()};$('#backup').onclick=backup;$('#restore').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=e=>{if(e.target.files[0])restoreFile(e.target.files[0])};addEventListener('beforeunload',save);render();</script></body></html>
