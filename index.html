<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Pray Note"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><title>Pray Note</title><link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><style>:root{--bg:#f7f7f4;--card:#fff;--text:#20201d;--muted:#8e8e86;--line:#e5e5df;--accent:#6f7564}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,sans-serif;letter-spacing:-.018em;-webkit-font-smoothing:antialiased}.app{width:min(100%,760px);margin:auto;padding:20px 20px 72px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:50px}.brand{font-size:14px;font-weight:650;white-space:nowrap}.right{display:flex;align-items:center;gap:8px}.language{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#ffffff90;border-radius:999px;padding-left:10px}.language-label{color:var(--muted);font-size:10px;line-height:1;font-weight:700;letter-spacing:.05em}.version,select{color:var(--muted);font-size:11px;font-weight:600}.language select{border:0;background:transparent;padding:6px 24px 6px 2px;outline:0}.version{border:1px solid var(--line);background:#ffffff90;border-radius:999px;padding:6px 9px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.nav button{border:0;background:transparent;color:var(--muted);padding:8px;border-radius:9px;font:inherit;cursor:pointer}.arrows{display:flex;gap:4px}.date{color:var(--accent);font-size:13px;font-weight:650;margin:0 0 7px}h1{font-size:clamp(31px,7vw,46px);line-height:1.08;letter-spacing:-.045em;margin:0;font-weight:680}.sub{color:var(--muted);font-size:14px;line-height:1.78;max-width:650px;margin:16px 0 26px;word-break:keep-all}.progress{display:flex;align-items:center;gap:12px;margin-bottom:28px}.track{height:3px;background:#e3e3dd;flex:1;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:var(--accent);transition:.2s}.count{font-size:11px;color:var(--muted);min-width:38px;text-align:right}.entries{display:grid;gap:12px}.entry{display:grid;grid-template-columns:36px 1fr auto;gap:9px;padding:16px 12px 15px 15px;background:var(--card);border:1px solid var(--line);border-radius:18px}.check{width:28px;height:28px;border:1px solid #d7d7d0;border-radius:50%;background:#fff;cursor:pointer}.done .check{background:var(--accent);border-color:var(--accent);color:white}.check:after{content:'✓';opacity:0}.done .check:after{opacity:1}.meta{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px}.num{color:var(--accent);margin-right:8px}textarea{width:100%;min-height:54px;resize:none;overflow:hidden;border:0;outline:0;background:transparent;color:var(--text);font:15px/1.7 Pretendard,sans-serif;padding:0;letter-spacing:-.017em}.done textarea{color:#66665f}.delete{border:0;background:transparent;color:#aaa;font-size:18px;cursor:pointer}.add{width:100%;margin-top:12px;padding:17px;border:1px dashed #d4d4cd;border-radius:18px;background:transparent;color:var(--muted);font:600 13px Pretendard;cursor:pointer}.reflection{margin-top:40px;padding-top:25px;border-top:1px solid var(--line)}label{display:block;color:var(--muted);font-size:11px;font-weight:650;margin-bottom:9px}input{width:100%;border:0;border-bottom:1px solid var(--line);outline:0;background:transparent;padding:4px 0 12px;font:15px Pretendard}.saved{height:18px;margin-top:12px;text-align:right;color:#aaa;font-size:11px}@media(max-width:560px){.app{padding:18px 16px 56px}.top{margin-bottom:42px;align-items:flex-start}.right{gap:5px}.language{gap:4px;padding-left:8px}.language-label{font-size:9px}.language select{padding-left:1px;padding-right:20px}.entry{grid-template-columns:34px 1fr auto}.sub{max-width:100%;line-height:1.72}}@media(max-width:390px){.language-label{display:none}.language{padding-left:4px}.brand{font-size:13px}}</style></head><body><main class="app"><header class="top"><div class="brand">● &nbsp;Pray Note</div><div class="right"><div class="language"><span class="language-label">LANGUAGE</span><select id="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="de">Deutsch</option><option value="ja">日本語</option><option value="zh">中文</option></select></div><span class="version">v1.2.0</span></div></header><section><div class="nav"><div class="arrows"><button id="prev">‹</button><button id="next">›</button></div><button id="today"></button></div><p class="date" id="date"></p><h1 id="title"></h1><p class="sub" id="sub"></p><div class="progress"><div class="track"><div class="bar" id="bar"></div></div><span class="count" id="count">0 / 5</span></div></section><section class="entries" id="entries"></section><button class="add" id="add"></button><section class="reflection"><label for="verse" id="verseLabel"></label><input id="verse" autocomplete="off"><div class="saved" id="saved"></div></section></main><template id="tpl"><article class="entry"><button class="check"></button><div><div class="meta"><span class="num"></span><span>PRAYER</span></div><textarea rows="2"></textarea></div><button class="delete">×</button></article></template><script>const V='1.2.0',KEY='praynote:data:v1',LK='praynote:lang',BASE=5;const T={ko:{today:'오늘',title:'오늘의 쓰는 기도',sub:'아무 것도 염려하지 말고 다만 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라 그리하면 모든 지각에 뛰어난 하나님의 평강이 그리스도 예수 안에서 너희 마음과 생각을 지키시리라 (빌립보서 4:6-7)',add:'＋ 기도 한 가지 더',verse:'오늘 마음에 남은 말씀 · 문장',versePh:'한 문장만 가볍게 남겨도 좋아요',ph:'기도 제목을 적어보세요',saved:'이 기기에서 자동 저장됨',saving:'저장 중…',locale:'ko-KR'},en:{today:'Today',title:"Today's Written Prayer",sub:'Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus. (Philippians 4:6–7)',add:'＋ Add another prayer',verse:'A verse · sentence that stayed with me',versePh:'Leave just one sentence if you like',ph:'Write a prayer here',saved:'Saved on this device',saving:'Saving…',locale:'en-US'},de:{today:'Heute',title:'Das heutige Gebet zum Schreiben',sub:'Sorget nichts! sondern in allen Dingen lasset eure Bitten im Gebet und Flehen mit Danksagung vor Gott kund werden. Und der Friede Gottes, welcher höher ist denn alle Vernunft, bewahre eure Herzen und Sinne in Christo Jesu! (Philipper 4,6–7)',add:'＋ Weiteres Gebet',verse:'Wort · Satz, der heute bleibt',versePh:'Ein einziger Satz genügt',ph:'Gebetsanliegen notieren',saved:'Auf diesem Gerät gespeichert',saving:'Speichern…',locale:'de-DE'},ja:{today:'今日',title:'今日書く祈り',sub:'何事をも思い煩うな。ただ、事ごとに、祈と願いとをなし、感謝して自分の求めるところを神に申し上げるがよい。そうすれば、人知ではとうてい測り知ることのできない神の平安が、あなたがたの心と思いとを、キリスト・イエスにあって守るであろう。（ピリピ人への手紙 4:6–7）',add:'＋ 祈りをもう一つ',verse:'今日、心に残った御言葉 · 一文',versePh:'一文だけでも残してみましょう',ph:'祈りの課題を書いてください',saved:'この端末に自動保存しました',saving:'保存中…',locale:'ja-JP'},zh:{today:'今天',title:'今天写下的祷告',sub:'应当一无挂虑，只要凡事借着祷告、祈求和感谢，将你们所要的告诉神。神所赐、出人意外的平安，必在基督耶稣里保守你们的心怀意念。（腓立比书 4:6–7）',add:'＋ 再添加一项祷告',verse:'今天留在心里的经文 · 一句话',versePh:'只写下一句话也很好',ph:'写下祷告事项',saved:'已自动保存在此设备',saving:'保存中…',locale:'zh-CN'}};let lang=localStorage.getItem(LK)||'ko',cur=new Date(),timer;cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate());const $=s=>document.querySelector(s),entries=$('#entries');function key(){return [cur.getFullYear(),String(cur.getMonth()+1).padStart(2,'0'),String(cur.getDate()).padStart(2,'0')].join('-')}function all(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return{}}}function day(){let d=all()[key()]||{prayers:[],verse:''};while(d.prayers.length<BASE)d.prayers.push({text:'',done:false});return d}function resize(x){x.style.height='auto';x.style.height=Math.max(54,x.scrollHeight)+'px'}function save(){let a=all();a[key()]={prayers:[...entries.children].map(e=>({text:e.querySelector('textarea').value,done:e.classList.contains('done')})),verse:$('#verse').value};localStorage.setItem(KEY,JSON.stringify(a));progress();$('#saved').textContent=T[lang].saved;setTimeout(()=>$('#saved').textContent='',1300)}function queue(){clearTimeout(timer);$('#saved').textContent=T[lang].saving;timer=setTimeout(save,250)}function card(p,i){let e=$('#tpl').content.firstElementChild.cloneNode(true),ta=e.querySelector('textarea');e.querySelector('.num').textContent=String(i+1).padStart(2,'0');ta.value=p.text||'';ta.placeholder=T[lang].ph;e.classList.toggle('done',!!p.done);e.querySelector('.delete').hidden=i<BASE;ta.oninput=()=>{resize(ta);queue()};e.querySelector('.check').onclick=()=>{e.classList.toggle('done');queue()};e.querySelector('.delete').onclick=()=>{if(entries.children.length>BASE){e.remove();renum();queue()}};requestAnimationFrame(()=>resize(ta));return e}function renum(){[...entries.children].forEach((e,i)=>{e.querySelector('.num').textContent=String(i+1).padStart(2,'0');e.querySelector('.delete').hidden=i<BASE});progress()}function progress(){let es=[...entries.children],n=es.filter(e=>e.classList.contains('done')).length;$('#count').textContent=n+' / '+es.length;$('#bar').style.width=(n/es.length*100)+'%'}function text(){let t=T[lang];document.documentElement.lang=lang;$('#today').textContent=t.today;$('#title').textContent=t.title;$('#sub').textContent=t.sub;$('#add').textContent=t.add;$('#verseLabel').textContent=t.verse;$('#verse').placeholder=t.versePh;$('#date').textContent=new Intl.DateTimeFormat(t.locale,{month:'long',day:'numeric',weekday:'long'}).format(cur);document.title=t.title+' · Pray Note'}function render(){let d=day();text();entries.innerHTML='';d.prayers.forEach((p,i)=>entries.append(card(p,i)));$('#verse').value=d.verse||'';progress()}function move(n){save();cur.setDate(cur.getDate()+n);render();scrollTo({top:0,behavior:'smooth'})}$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#today').onclick=()=>{save();let d=new Date();cur=new Date(d.getFullYear(),d.getMonth(),d.getDate());render()};$('#add').onclick=()=>{let e=card({text:'',done:false},entries.children.length);entries.append(e);renum();queue();e.querySelector('textarea').focus()};$('#verse').oninput=queue;$('#lang').value=lang;$('#lang').onchange=e=>{lang=e.target.value;localStorage.setItem(LK,lang);render()};addEventListener('beforeunload',save);render();</script></body></html>
