<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Pray Note"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><title>Pray Note</title><link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><style>:root{--bg:#f7f7f4;--card:#fff;--text:#20201d;--muted:#8e8e86;--line:#e5e5df;--accent:#6f7564}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,sans-serif;letter-spacing:-.018em;-webkit-font-smoothing:antialiased}.app{width:min(100%,760px);margin:auto;padding:20px 20px 72px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:50px}.brand{font-size:14px;font-weight:650}.right{display:flex;align-items:center;gap:8px}.version,select{border:1px solid var(--line);background:#ffffff90;color:var(--muted);border-radius:999px;font-size:11px;font-weight:600}select{padding:6px 24px 6px 9px}.version{padding:6px 9px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.nav button{border:0;background:transparent;color:var(--muted);padding:8px;border-radius:9px;font:inherit;cursor:pointer}.arrows{display:flex;gap:4px}.date{color:var(--accent);font-size:13px;font-weight:650;margin:0 0 7px}h1{font-size:clamp(31px,7vw,46px);line-height:1.08;letter-spacing:-.045em;margin:0;font-weight:680}.sub{color:var(--muted);font-size:14px;line-height:1.65;max-width:510px;margin:13px 0 24px}.progress{display:flex;align-items:center;gap:12px;margin-bottom:28px}.track{height:3px;background:#e3e3dd;flex:1;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:var(--accent);transition:.2s}.count{font-size:11px;color:var(--muted);min-width:38px;text-align:right}.entries{display:grid;gap:12px}.entry{display:grid;grid-template-columns:36px 1fr auto;gap:9px;padding:16px 12px 15px 15px;background:var(--card);border:1px solid var(--line);border-radius:18px}.check{width:28px;height:28px;border:1px solid #d7d7d0;border-radius:50%;background:#fff;cursor:pointer}.done .check{background:var(--accent);border-color:var(--accent);color:white}.check:after{content:'✓';opacity:0}.done .check:after{opacity:1}.meta{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px}.num{color:var(--accent);margin-right:8px}textarea{width:100%;min-height:54px;resize:none;overflow:hidden;border:0;outline:0;background:transparent;color:var(--text);font:15px/1.7 Pretendard,sans-serif;padding:0;letter-spacing:-.017em}.done textarea{color:#66665f}.delete{border:0;background:transparent;color:#aaa;font-size:18px;cursor:pointer}.add{width:100%;margin-top:12px;padding:17px;border:1px dashed #d4d4cd;border-radius:18px;background:transparent;color:var(--muted);font:600 13px Pretendard;cursor:pointer}.reflection{margin-top:40px;padding-top:25px;border-top:1px solid var(--line)}label{display:block;color:var(--muted);font-size:11px;font-weight:650;margin-bottom:9px}input{width:100%;border:0;border-bottom:1px solid var(--line);outline:0;background:transparent;padding:4px 0 12px;font:15px Pretendard}.saved{height:18px;margin-top:12px;text-align:right;color:#aaa;font-size:11px}@media(max-width:560px){.app{padding:18px 16px 56px}.top{margin-bottom:42px}.right{gap:5px}.entry{grid-template-columns:34px 1fr auto}}</style></head><body><main class="app"><header class="top"><div class="brand">● &nbsp;Pray Note</div><div class="right"><select id="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="de">Deutsch</option><option value="ja">日本語</option><option value="zh">中文</option></select><span class="version">v1.1.0</span></div></header><section><div class="nav"><div class="arrows"><button id="prev">‹</button><button id="next">›</button></div><button id="today"></button></div><p class="date" id="date"></p><h1 id="title"></h1><p class="sub" id="sub"></p><div class="progress"><div class="track"><div class="bar" id="bar"></div></div><span class="count" id="count">0 / 5</span></div></section><section class="entries" id="entries"></section><button class="add" id="add"></button><section class="reflection"><label for="verse" id="verseLabel"></label><input id="verse" autocomplete="off"><div class="saved" id="saved"></div></section></main><template id="tpl"><article class="entry"><button class="check"></button><div><div class="meta"><span class="num"></span><span>PRAYER</span></div><textarea rows="2"></textarea></div><button class="delete">×</button></article></template><script>const V='1.1.0',KEY='praynote:data:v1',LK='praynote:lang',BASE=5;const T={ko:{today:'오늘',title:'오늘의 기도',sub:'마음에 있는 것을 다섯 가지부터 천천히 적어보세요. 더 기도하고 싶은 내용은 필요한 만큼 추가할 수 있습니다.',add:'＋ 기도 한 가지 더',verse:'오늘 마음에 남은 말씀 · 문장',versePh:'한 문장만 가볍게 남겨도 좋아요',ph:'기도 제목을 적어보세요',saved:'이 기기에서 자동 저장됨',saving:'저장 중…',locale:'ko-KR'},en:{today:'Today',title:"Today's Prayer",sub:'Begin with five things on your heart. Add as many more prayers as you need.',add:'＋ Add another prayer',verse:'A verse · sentence that stayed with me',versePh:'Leave just one sentence if you like',ph:'Write a prayer here',saved:'Saved on this device',saving:'Saving…',locale:'en-US'},de:{today:'Heute',title:'Gebet für heute',sub:'Beginne mit fünf Anliegen, die dir am Herzen liegen. Füge bei Bedarf weitere hinzu.',add:'＋ Weiteres Gebet',verse:'Wort · Satz, der heute bleibt',versePh:'Ein einziger Satz genügt',ph:'Gebetsanliegen notieren',saved:'Auf diesem Gerät gespeichert',saving:'Speichern…',locale:'de-DE'},ja:{today:'今日',title:'今日の祈り',sub:'心にあることを、まず5つからゆっくり書いてみましょう。必要なだけ祈りを追加できます。',add:'＋ 祈りをもう一つ',verse:'今日、心に残った御言葉 · 一文',versePh:'一文だけでも残してみましょう',ph:'祈りの課題を書いてください',saved:'この端末に自動保存しました',saving:'保存中…',locale:'ja-JP'},zh:{today:'今天',title:'今天的祷告',sub:'先慢慢写下心中的五件事。需要时，可以继续添加更多祷告事项。',add:'＋ 再添加一项祷告',verse:'今天留在心里的经文 · 一句话',versePh:'只写下一句话也很好',ph:'写下祷告事项',saved:'已自动保存在此设备',saving:'保存中…',locale:'zh-CN'}};let lang=localStorage.getItem(LK)||'ko',cur=new Date(),timer;cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate());const $=s=>document.querySelector(s),entries=$('#entries');function key(){return [cur.getFullYear(),String(cur.getMonth()+1).padStart(2,'0'),String(cur.getDate()).padStart(2,'0')].join('-')}function all(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return{}}}function day(){let d=all()[key()]||{prayers:[],verse:''};while(d.prayers.length<BASE)d.prayers.push({text:'',done:false});return d}function resize(x){x.style.height='auto';x.style.height=Math.max(54,x.scrollHeight)+'px'}function save(){let a=all();a[key()]={prayers:[...entries.children].map(e=>({text:e.querySelector('textarea').value,done:e.classList.contains('done')})),verse:$('#verse').value};localStorage.setItem(KEY,JSON.stringify(a));progress();$('#saved').textContent=T[lang].saved;setTimeout(()=>$('#saved').textContent='',1300)}function queue(){clearTimeout(timer);$('#saved').textContent=T[lang].saving;timer=setTimeout(save,250)}function card(p,i){let e=$('#tpl').content.firstElementChild.cloneNode(true),ta=e.querySelector('textarea');e.querySelector('.num').textContent=String(i+1).padStart(2,'0');ta.value=p.text||'';ta.placeholder=T[lang].ph;e.classList.toggle('done',!!p.done);e.querySelector('.delete').hidden=i<BASE;ta.oninput=()=>{resize(ta);queue()};e.querySelector('.check').onclick=()=>{e.classList.toggle('done');queue()};e.querySelector('.delete').onclick=()=>{if(entries.children.length>BASE){e.remove();renum();queue()}};requestAnimationFrame(()=>resize(ta));return e}function renum(){[...entries.children].forEach((e,i)=>{e.querySelector('.num').textContent=String(i+1).padStart(2,'0');e.querySelector('.delete').hidden=i<BASE});progress()}function progress(){let es=[...entries.children],n=es.filter(e=>e.classList.contains('done')).length;$('#count').textContent=n+' / '+es.length;$('#bar').style.width=(n/es.length*100)+'%'}function text(){let t=T[lang];document.documentElement.lang=lang;$('#today').textContent=t.today;$('#title').textContent=t.title;$('#sub').textContent=t.sub;$('#add').textContent=t.add;$('#verseLabel').textContent=t.verse;$('#verse').placeholder=t.versePh;$('#date').textContent=new Intl.DateTimeFormat(t.locale,{month:'long',day:'numeric',weekday:'long'}).format(cur);document.title=t.title+' · Pray Note'}function render(){let d=day();text();entries.innerHTML='';d.prayers.forEach((p,i)=>entries.append(card(p,i)));$('#verse').value=d.verse||'';progress()}function move(n){save();cur.setDate(cur.getDate()+n);render();scrollTo({top:0,behavior:'smooth'})}$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#today').onclick=()=>{save();let d=new Date();cur=new Date(d.getFullYear(),d.getMonth(),d.getDate());render()};$('#add').onclick=()=>{let e=card({text:'',done:false},entries.children.length);entries.append(e);renum();queue();e.querySelector('textarea').focus()};$('#verse').oninput=queue;$('#lang').value=lang;$('#lang').onchange=e=>{lang=e.target.value;localStorage.setItem(LK,lang);render()};addEventListener('beforeunload',save);render();</script></body></html>
