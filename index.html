"] input[type="text"]{font-size:21px;line-height:1.65;padding-bottom:14px}[data-text-size="xlarge"] .saved{font-size:14px}@media(max-width:560px){.app{padding:18px 16px calc(56px + env(safe-area-inset-bottom))}.controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.control,.data-control{width:100%}.control select{width:100%;max-width:none}.data-control{grid-column:1/-1}.data-actions{margin-left:auto}.sub{font-size:13.5px}[data-text-size="large"] .sub{font-size:16px}[data-text-size="xlarge"] .app{padding:18px 14px calc(60px + env(safe-area-inset-bottom))}[data-text-size="xlarge"] .sub{font-size:18px;line-height:1.9}[data-text-size="xlarge"] .entry{grid-template-columns:38px minmax(0,1fr) auto;gap:10px;padding:19px 13px 18px 15px}[data-text-size="xlarge"] textarea{font-size:20px;line-height:1.85}[data-text-size="xlarge"] input[type="text"]{font-size:20px}}@media(max-width:380px){.controls{grid-template-columns:1fr}.data-control{grid-column:auto}}</style></head><body><main class="app"><header class="top"><div class="brand">● &nbsp;Pray Note</div><div class="version"><span>v1.4.5</span><button class="text-toggle" id="textSize" type="button" aria-pressed="false" aria-label="Larger text" title="Larger text">A</button></div><div class="controls"><label class="control"><span class="control-label">LANGUAGE</span><select id="lang"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="zh-TW">繁體中文 · 台灣</option><option value="zh-CN">简体中文 · 中国</option><option value="id">Bahasa Indonesia</option></select></label><label class="control"><span class="control-label">THEME</span><select id="theme"></select></label><div class="data-control"><span class="control-label">BACKUP</span><div class="data-actions"><button class="mini-btn" id="backup"></button><button class="mini-btn" id="restore"></button></div></div><input class="sr-only" id="restoreFile" type="file" accept="application/json,.json"></div></header><section><div class="nav"><div class="arrows"><button id="prev">‹</button><button id="next">›</button></div><button id="today"></button></div><p class="date" id="date"></p><h1 id="title"></h1><p class="sub" id="sub"></p><div class="progress"><div class="track"><div class="bar" id="bar"></div></div><span class="count" id="count"></span></div></section><section class="entries" id="entries"></section><button class="add" id="add"></button><section class="reflection"><label class="reflection-label" for="verse" id="verseLabel"></label><input id="verse" type="text"><div class="saved" id="saved"></div></section></main><template id="tpl"><article class="entry"><button class="check"></button><div><div class="meta"><span class="num"></span><span>PRAYER</span></div><textarea rows="2"></textarea></div><button class="delete">×</button></article></template><script>const V='1.4.5',KEY='praynote:data:v1',LK='praynote:lang',TK='praynote:theme',SK='praynote:textsize',BASE=5;const C={themeCurrent:'Original',themeContrast:'High contrast',themeDark:'Dark mode',backup:'Backup',restore:'Restore',restoreAsk:'Replace saved data with this backup?',restoreDone:'Backup restored.',restoreError:'Invalid Pray Note backup.'};const T={ko:{today:'오늘',title:'오늘의 쓰는 기도',sub:'아무 것도 염려하지 말고 다만 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라 그리하면 모든 지각에 뛰어난 하나님의 평강이 그리스도 예수 안에서 너희 마음과 생각을 지키시리라 (빌립보서 4:6-7)',add:'＋ 기도 한 가지 더',verse:'오늘 마음에 남은 말씀 · 문장',versePh:'한 문장만 가볍게 남겨도 좋아요',ph:'기도 제목을 적어보세요',saved:'✓ 저장됨',saving:'저장 중…',locale:'ko-KR',...C},en:{today:'Today',title:"Today's Written Prayer",sub:'Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus. (Philippians 4:6–7)',add:'＋ Add another prayer',verse:'A verse · sentence that stayed with me',versePh:'Leave just one sentence if you like',ph:'Write a prayer here',saved:'✓ Saved',saving:'Saving…',locale:'en-US',...C},ja:{today:'今日',title:'今日書く祈り',sub:'何事をも思い煩うな。ただ、事ごとに、祈と願いとをなし、感謝して自分の求めるところを神に申し上げるがよい。そうすれば、人知ではとうてい測り知ることのできない神の平安が、あなたがたの心と思いとを、キリスト・イエスにあって守るであろう。（ピリピ人への手紙 4:6–7）',add:'＋ 祈りをもう一つ',verse:'今日、心に残った御言葉 · 一文',versePh:'一文だけでも残してみましょう',ph:'祈りの課題を書いてください',saved:'✓ 保存済み',saving:'保存中…',locale:'ja-JP',...C},de:{today:'Heute',title:'Das heutige Gebet zum Schreiben',sub:'Sorget nichts! sondern in allen Dingen lasset eure Bitten im Gebet und Flehen mit Danksagung vor Gott kund werden. Und der Friede Gottes, welcher höher ist denn alle Vernunft, bewahre eure Herzen und Sinne in Christo Jesu! (Philipper 4,6–7)',add:'＋ Weiteres Gebet',verse:'Wort · Satz, der heute bleibt',versePh:'Ein einziger Satz genügt',ph:'Gebetsanliegen notieren',saved:'✓ Gespeichert',saving:'Speichern…',locale:'de-DE',...C},fr:{today:"Aujourd’hui",title:"La prière écrite d’aujourd’hui",sub:"Ne vous inquiétez de rien; mais en toute chose faites connaître vos besoins à Dieu par des prières et des supplications, avec des actions de grâces. Et la paix de Dieu, qui surpasse toute intelligence, gardera vos cœurs et vos pensées en Jésus-Christ. (Philippiens 4:6–7)",add:'＋ Ajouter une prière',verse:'Un verset · une phrase qui reste en moi',versePh:'Une seule phrase suffit',ph:'Écrivez votre sujet de prière',saved:'✓ Enregistré',saving:'Enregistrement…',locale:'fr-FR',...C},es:{today:'Hoy',title:'La oración escrita de hoy',sub:'Por nada estéis afanosos; sino sean notorias vuestras peticiones delante de Dios en toda oración y ruego, con hacimiento de gracias. Y la paz de Dios, que sobrepuja todo entendimiento, guardará vuestros corazones y vuestros entendimientos en Cristo Jesús. (Filipenses 4:6–7)',add:'＋ Añadir otra oración',verse:'Un versículo · una frase que permanece',versePh:'Una sola frase está bien',ph:'Escribe tu petición de oración',saved:'✓ Guardado',saving:'Guardando…',locale:'es-ES',...C},'zh-TW':{today:'今天',title:'今天寫下的禱告',sub:'應當一無掛慮，只要凡事藉著禱告、祈求和感謝，將你們所要的告訴神。神所賜、超越人所能理解的平安，必在基督耶穌裡保守你們的心懷意念。（腓立比書 4:6–7）',add:'＋ 再加一項禱告',verse:'今天留在心裡的經文 · 一句話',versePh:'只寫下一句話也很好',ph:'寫下禱告事項',saved:'✓ 已儲存',saving:'儲存中…',locale:'zh-TW',...C},'zh-CN':{today:'今天',title:'今天写下的祷告',sub:'应当一无挂虑，只要凡事借着祷告、祈求和感谢，将你们所要的告诉神。神所赐、出人意外的平安，必在基督耶稣里保守你们的心怀意念。（腓立比书 4:6–7）',add:'＋ 再添加一项祷告',verse:'今天留在心里的经文 · 一句话',versePh:'只写下一句话也很好',ph:'写下祷告事项',saved:'✓ 已保存',saving:'保存中…',locale:'zh-CN',...C},id:{today:'Hari ini',title:'Doa yang Ditulis Hari Ini',sub:'Janganlah hendaknya kamu kuatir tentang apapun juga, tetapi nyatakanlah dalam segala hal keinginanmu kepada Allah dalam doa dan permohonan dengan ucapan syukur. Damai sejahtera Allah, yang melampaui segala akal, akan memelihara hati dan pikiranmu dalam Kristus Yesus. (Filipi 4:6–7)',add:'＋ Tambah doa',verse:'Ayat · kalimat yang tinggal di hati',versePh:'Satu kalimat saja juga cukup',ph:'Tuliskan pokok doa',saved:'✓ Tersimpan',saving:'Menyimpan…',locale:'id-ID',...C}};let lang=localStorage.getItem(LK)||'ko';if(lang==='zh')lang='zh-CN';if(!T[lang])lang='ko';let theme=localStorage.getItem(TK)||'current',textSize=localStorage.getItem(SK)||'normal';if(!['normal','large','xlarge'].includes(textSize))textSize='normal';let cur=new Date(),statusTimer;cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate());const $=s=>document.querySelector(s),entries=$('#entries');function key(){return [cur.getFullYear(),String(cur.getMonth()+1).padStart(2,'0'),String(cur.getDate()).padStart(2,'0')].join('-')}function all(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return{}}}function day(){let d=all()[key()]||{prayers:[],verse:''};while(d.prayers.length<BASE)d.prayers.push({text:'',done:false});return d}function resize(x){x.style.height='auto';x.style.height=Math.max(54,x.scrollHeight)+'px'}function applyTheme(){document.documentElement.dataset.theme=theme==='current'?'':theme;$('#theme').value=theme}function applyTextSize(){document.documentElement.dataset.textSize=textSize==='normal'?'':textSize;let b=$('#textSize');b.textContent=textSize==='normal'?'A':textSize==='large'?'A+':'A++';b.setAttribute('aria-pressed',String(textSize!=='normal'));b.title=textSize==='normal'?'Larger text':textSize==='large'?'Extra large text':'Default text size';b.setAttribute('aria-label',b.title)}function save(){let a=all();a[key()]={prayers:[...entries.children].map(e=>({text:e.querySelector('textarea').value,done:e.classList.contains('done')})),verse:$('#verse').value};localStorage.setItem(KEY,JSON.stringify(a));progress()}function saveNow(showStatus=true){save();if(showStatus){clearTimeout(statusTimer);$('#saved').textContent=T[lang].saved;statusTimer=setTimeout(()=>$('#saved').textContent='',1200)}}function card(p,i){let e=$('#tpl').content.firstElementChild.cloneNode(true),ta=e.querySelector('textarea');e.querySelector('.num').textContent=String(i+1).padStart(2,'0');ta.value=p.text||'';ta.placeholder=T[lang].ph;e.classList.toggle('done',!!p.done);e.querySelector('.delete').hidden=i<BASE;ta.oninput=()=>{resize(ta);saveNow()};e.querySelector('.check').onclick=()=>{e.classList.toggle('done');saveNow()};e.querySelector('.delete').onclick=()=>{if(entries.children.length>BASE){e.remove();renum();saveNow()}};requestAnimationFrame(()=>resize(ta));return e}function renum(){[...entries.children].forEach((e,i)=>{e.querySelector('.num').textContent=String(i+1).padStart(2,'0');e.querySelector('.delete').hidden=i<BASE});progress()}function progress(){let es=[...entries.children],n=es.filter(e=>e.classList.contains('done')).length;$('#count').textContent=n+' / '+es.length;$('#bar').style.width=(es.length?n/es.length*100:0)+'%'}function themeOptions(){let t=T[lang];$('#theme').innerHTML=`<option value="current">${t.themeCurrent}</option><option value="contrast">${t.themeContrast}</option><option value="dark">${t.themeDark}</option>`;$('#theme').value=theme}function text(){let t=T[lang];document.documentElement.lang=lang;$('#today').textContent=t.today;$('#title').textContent=t.title;$('#sub').textContent=t.sub;$('#add').textContent=t.add;$('#verseLabel').textContent=t.verse;$('#verse').placeholder=t.versePh;$('#backup').textContent=t.backup;$('#restore').textContent=t.restore;themeOptions();$('#date').textContent=new Intl.DateTimeFormat(t.locale,{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(cur);document.title=t.title+' · Pray Note'}function render(){let d=day();text();entries.innerHTML='';d.prayers.forEach((p,i)=>entries.append(card(p,i)));$('#verse').value=d.verse||'';progress();applyTheme();applyTextSize()}function move(n){saveNow(false);cur.setDate(cur.getDate()+n);render()}function backup(){saveNow(false);let p={app:'Pray Note',version:V,exportedAt:new Date().toISOString(),language:lang,theme,textSize,data:all()},u=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='praynote-backup.json';a.click();URL.revokeObjectURL(u)}async function restoreFile(f){try{let p=JSON.parse(await f.text());if(p.app!=='Pray Note'||!p.data)throw 0;if(!confirm(T[lang].restoreAsk))return;localStorage.setItem(KEY,JSON.stringify(p.data));if(T[p.language])lang=p.language;if(['current','contrast','dark'].includes(p.theme))theme=p.theme;if(['normal','large','xlarge'].includes(p.textSize))textSize=p.textSize;localStorage.setItem(LK,lang);localStorage.setItem(TK,theme);localStorage.setItem(SK,textSize);render();alert(T[lang].restoreDone)}catch{alert(T[lang].restoreError)}}$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#today').onclick=()=>{saveNow(false);let d=new Date();cur=new Date(d.getFullYear(),d.getMonth(),d.getDate());render()};$('#add').onclick=()=>{entries.append(card({text:'',done:false},entries.children.length));renum();saveNow()};$('#verse').oninput=()=>saveNow();$('#lang').value=lang;$('#lang').onchange=e=>{saveNow(false);lang=e.target.value;localStorage.setItem(LK,lang);render()};$('#theme').onchange=e=>{theme=e.target.value;localStorage.setItem(TK,theme);applyTheme()};$('#textSize').onclick=()=>{textSize=textSize==='normal'?'large':textSize==='large'?'xlarge':'normal';localStorage.setItem(SK,textSize);applyTextSize();requestAnimationFrame(()=>[...entries.querySelectorAll('textarea')].forEach(resize))};$('#backup').onclick=backup;$('#restore').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=e=>e.target.files[0]&&restoreFile(e.target.files[0]);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow(false)});addEventListener('pagehide',()=>saveNow(false));addEventListener('beforeunload',()=>saveNow(false));render();</script></body></html>
