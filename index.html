<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f4"><meta name="color-scheme" content="light dark"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Pray Note"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=141"><link rel="icon" href="apple-touch-icon.png?v=141"><link rel="manifest" href="manifest.webmanifest"><title>Pray Note</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7f4;color:#20201d;margin:0}.app{max-width:760px;margin:auto;padding:20px}.version{float:right;font-size:11px;color:#777}select{font:inherit;padding:8px}.sub{line-height:1.7;color:#777}textarea,input{width:100%;box-sizing:border-box;margin:6px 0 12px;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff}.entry{margin:10px 0}.check{margin-right:8px}.done textarea{text-decoration:line-through;opacity:.55}button{padding:8px 10px}.bar{height:3px;background:#6f7564}.track{background:#ddd}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 36px}h1{letter-spacing:-.016em}</style></head><body><main class="app"><b>● &nbsp;Pray Note</b><span class="version">v1.4.1</span><div class="controls"><label>LANGUAGE <select id="lang"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="zh-TW">繁體中文 · 台灣</option><option value="zh-CN">简体中文 · 中国</option><option value="id">Bahasa Indonesia</option></select></label></div><p id="date"></p><h1 id="title"></h1><p class="sub" id="sub"></p><div id="entries"></div><button id="add"></button><h5 id="verseLabel"></h5><input id="verse"></main><script>const V='1.4.1',KEY='praynote:data:v1',LK='praynote:lang',BASE=5;const T={ko:['오늘의 쓰는 기도','아무 것도 염려하지 말고 다만 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라 그리하면 모든 지각에 뛰어난 하나님의 평강이 그리스도 예수 안에서 너희 마음과 생각을 지키시리라 (빌립보서 4:6-7)','＋ 기도 한 가지 더','오늘 마음에 남은 말씀 · 문장','기도 제목을 적어보세요','ko-KR'],en:["Today's Written Prayer",'Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus. (Philippians 4:6–7)','＋ Add another prayer','A verse · sentence that stayed with me','Write a prayer here','en-US'],ja:['今日書く祈り','何事をも思い煩うな。ただ、事ごとに、祈と願いとをなし、感謝して自分の求めるところを神に申し上げるがよい。そうすれば、人知ではとうてい測り知ることのできない神の平安が、あなたがたの心と思いとを、キリスト・イエスにあって守るであろう。（ピリピ人への手紙 4:6–7）','＋ 祈りをもう一つ','今日、心に残った御言葉 · 一文','祈りの課題を書いてください','ja-JP'],de:['Das heutige Gebet zum Schreiben','Sorget nichts! sondern in allen Dingen lasset eure Bitten im Gebet und Flehen mit Danksagung vor Gott kund werden. Und der Friede Gottes, welcher höher ist denn alle Vernunft, bewahre eure Herzen und Sinne in Christo Jesu! (Philipper 4,6–7)','＋ Weiteres Gebet','Wort · Satz, der heute bleibt','Gebetsanliegen notieren','de-DE'],fr:["La prière écrite d’aujourd’hui","Ne vous inquiétez de rien; mais en toute chose faites connaître vos besoins à Dieu par des prières et des supplications, avec des actions de grâces. Et la paix de Dieu, qui surpasse toute intelligence, gardera vos cœurs et vos pensées en Jésus-Christ. (Philippiens 4:6–7)",'＋ Ajouter une prière','Un verset · une phrase qui reste en moi','Écrivez votre sujet de prière','fr-FR'],es:['La oración escrita de hoy','Por nada estéis afanosos; sino sean notorias vuestras peticiones delante de Dios en toda oración y ruego, con hacimiento de gracias. Y la paz de Dios, que sobrepuja todo entendimiento, guardará vuestros corazones y vuestros entendimientos en Cristo Jesús. (Filipenses 4:6–7)','＋ Añadir otra oración','Un versículo · una frase que permanece','Escribe tu petición de oración','es-ES'],'zh-TW':['今天寫下的禱告','應當一無掛慮，只要凡事藉著禱告、祈求和感謝，將你們所要的告訴神。神所賜、超越人所能理解的平安，必在基督耶穌裡保守你們的心懷意念。（腓立比書 4:6–7）','＋ 再加一項禱告','今天留在心裡的經文 · 一句話','寫下禱告事項','zh-TW'],'zh-CN':['今天写下的祷告','应当一无挂虑，只要凡事借着祷告、祈求和感谢，将你们所要的告诉神。神所赐、出人意外的平安，必在基督耶稣里保守你们的心怀意念。（腓立比书 4:6–7）','＋ 再添加一项祷告','今天留在心里的经文 · 一句话','写下祷告事项','zh-CN'],id:['Doa yang Ditulis Hari Ini','Janganlah hendaknya kamu kuatir tentang apapun juga, tetapi nyatakanlah dalam segala hal keinginanmu kepada Allah dalam doa dan permohonan dengan ucapan syukur. Damai sejahtera Allah, yang melampaui segala akal, akan memelihara hati dan pikiranmu dalam Kristus Yesus. (Filipi 4:6–7)','＋ Tambah doa','Ayat · kalimat yang tinggal di hati','Tuliskan pokok doa','id-ID']};let lang=localStorage.getItem(LK)||'ko';if(lang==='zh')lang='zh-CN';if(!T[lang])lang='ko';let cur=new Date();const $=s=>document.querySelector(s);function k(){return cur.toISOString().slice(0,10)}function all(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return{}}}function day(){let d=all()[k()]||{prayers:[],verse:''};while(d.prayers.length<BASE)d.prayers.push({text:'',done:false});return d}function save(){let a=all();a[k()]={prayers:[...document.querySelectorAll('.entry')].map(e=>({text:e.querySelector('textarea').value,done:e.classList.contains('done')})),verse:$('#verse').value};localStorage.setItem(KEY,JSON.stringify(a))}function render(){let t=T[lang],d=day();document.documentElement.lang=lang;$('#date').textContent=new Intl.DateTimeFormat(t[5],{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(cur);$('#title').textContent=t[0];$('#sub').textContent=t[1];$('#add').textContent=t[2];$('#verseLabel').textContent=t[3];$('#verse').value=d.verse||'';$('#entries').innerHTML='';d.prayers.forEach((p,i)=>{let e=document.createElement('div');e.className='entry'+(p.done?' done':'');e.innerHTML=`<button class="check">✓</button><b>${String(i+1).padStart(2,'0')} PRAYER</b><textarea placeholder="${t[4]}"></textarea>${i>=BASE?'<button class="del">×</button>':''}`;e.querySelector('textarea').value=p.text||'';e.querySelector('textarea').oninput=save;e.querySelector('.check').onclick=()=>{e.classList.toggle('done');save()};let x=e.querySelector('.del');if(x)x.onclick=()=>{e.remove();save()};$('#entries').append(e)});$('#verse').oninput=save}$('#lang').value=lang;$('#lang').onchange=e=>{lang=e.target.value;localStorage.setItem(LK,lang);render()};$('#add').onclick=()=>{save();let a=all(),d=day();d.prayers.push({text:'',done:false});a[k()]=d;localStorage.setItem(KEY,JSON.stringify(a));render()};render();</script></body></html>
